services:
  health:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - .env
    environment:
      PORT: "8787"
      DATA_DIR: /app/data
    volumes:
      - health-data:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  health-data:
